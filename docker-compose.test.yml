# Run with: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm test
services:
  test:
    image: golang:1.26-alpine
    working_dir: /src
    volumes:
      - .:/src:ro
      - test-go-cache:/go
    environment:
      RELAY_INTEGRATION: "1"
      DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD:-}@postgres:5432/relay?sslmode=disable
      REDIS_URL: redis://redis:6379/1
    # Alpine needs a C compiler for the race detector. Unit CI also runs -race.
    command: ["sh", "-c", "apk add --no-cache gcc musl-dev && go test -race -count=1 ./... && go vet ./..."]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  test-go-cache:
