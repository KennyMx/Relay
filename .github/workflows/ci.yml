name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Build and start the full stack
        run: docker compose up --build -d --wait
      - name: Race tests with real PostgreSQL and Redis, plus vet
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm test
      - name: Verify the running API without paid providers
        run: docker compose exec -T gateway relay-verify
      - name: Service logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop services
        if: always()
        run: docker compose down
